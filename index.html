<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hwaho AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;overflow:hidden}
body{display:grid;place-items:center;background:#0b0d14;color:#fff}

/* 폰 화면: 좌우 여백 0, 화면 꽉 채움 */
#phone{position:relative;width:100vw;height:100dvh;margin:0;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(ellipse 80% 38% at 78% 78%,#ffb347 0%,#f28d3a 35%,transparent 70%),
    radial-gradient(ellipse 70% 30% at 20% 92%,#ffe27a 0%,#f0b24a 40%,transparent 72%),
    radial-gradient(ellipse 90% 40% at 8% 55%,#34b3a0 0%,#2c8f9c 40%,transparent 75%),
    radial-gradient(ellipse 80% 45% at 100% 40%,#2c5fd0 0%,#2a6fd8 40%,transparent 75%),
    linear-gradient(180deg,#3a86d9 0%,#2f74cf 35%,#2a8ab8 65%,#e9a653 100%)}
/* 월페이퍼 곡선 느낌 */
#phone:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 45% 62%,transparent 0 34%,#ffffff22 34.4%,transparent 35.4%),
    radial-gradient(circle at 45% 62%,transparent 0 46%,#1b3f9a55 46.4%,transparent 48%),
    radial-gradient(circle at 25% 78%,#ffffff26 0,transparent 30%)}
/* 위 -> 아래 부드러운 빛 */
#phone:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,#ffffff14,transparent 25%,#0a1d5a22)}

/* 글래스 공통 */
.glass{background:linear-gradient(150deg,#ffffff52,#ffffff1f);
  backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
  border:1px solid #ffffff59;
  box-shadow:inset 0 1px 1px #ffffffb3,inset 0 -1px 2px #ffffff30,0 10px 30px #0a1d5a40}

.status{position:absolute;top:0;left:0;right:0;z-index:10;height:calc(54px + env(safe-area-inset-top,0px));flex-shrink:0;padding:calc(16px + env(safe-area-inset-top,0px)) 30px 0 34px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;background:var(--app-status-bg,transparent);transition:background-color .18s ease}
.status #clock{font-size:17px;font-weight:600;letter-spacing:-.3px;color:#fff;text-shadow:0 1px 3px #0a1d5a40}
.island{overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:width .38s cubic-bezier(.2,.9,.25,1),height .38s cubic-bezier(.2,.9,.25,1),border-radius .38s cubic-bezier(.2,.9,.25,1);position:absolute;left:50%;top:calc(11px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:120px;height:35px;border-radius:20px;background:#000}
.status .signals{display:flex;gap:6px;align-items:center}
.status svg{height:13px;width:auto}

main{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:24px;column-gap:0;padding:calc(env(safe-area-inset-top,0px) + 84px) 0 0;margin:0;align-content:start;width:100%;flex:1 1 auto;min-height:0}
a{color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500;text-shadow:0 1px 4px #10285e80;min-width:0}
.icon{position:relative;width:60px;height:60px;border-radius:15px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(150deg,#ffffffee,#ffffffb8);
  box-shadow:inset 0 1px 1px #fff,inset 0 -2px 3px #0000001a,0 8px 16px #0c224f40,0 1px 3px #0c224f30}
.icon:before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,#ffffff8c,transparent);pointer-events:none;z-index:2}
svg{width:100%;height:100%;display:block}

/* 검색 알약 */
.search{position:relative;z-index:1;margin:auto auto 14px;height:36px;padding:0 18px;border-radius:20px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#ffffffee;flex-shrink:0}
.search svg{width:14px;height:14px}

/* 독: 좌우 여백 0 */
.dock{position:absolute;z-index:1;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);transform:translateX(-50%);width:auto;height:84px;padding:0 14px;border-radius:42px;display:flex;align-items:center;justify-content:center;gap:16px}
.dock .icon{width:60px;height:60px;border-radius:15px}
.dock a{gap:0;text-shadow:none;transform:translateY(0)}

#phone.app-open .dock{background:var(--app-bottom-bg,#fff);box-shadow:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}#phone.app-open .dock>a{visibility:hidden}.island.ex{width:300px;height:64px;border-radius:32px}.island .isl-t,.island .isl-s{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;padding:0 14px}.island .isl-t{font-size:13px;font-weight:600}.island .isl-s{font-size:11px;opacity:.7}#phone.app-open .homebar{left:0;right:0;width:auto;transform:none;bottom:0;height:calc(28px + env(safe-area-inset-bottom,0px));align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);background:var(--app-bottom-bg,#fff)}.homebar{position:absolute;z-index:12;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 2px);width:150px;height:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.homebar:after{content:"";width:138px;height:5px;border-radius:999px;background:rgba(235,235,240,.9);box-shadow:0 0 2px rgba(0,0,0,.16);pointer-events:none}#phone.app-light .homebar:after{background:rgba(0,0,0,.8);box-shadow:none}

iframe{display:none;position:absolute;top:54px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 54px);border:0;background:#fff;z-index:5;opacity:1;transform:translateY(0) scale(1);transform-origin:center;will-change:opacity,transform}
iframe.app-entering{display:block;animation:appEnter .28s cubic-bezier(.2,.85,.25,1) both}
iframe.app-leaving{display:block;animation:appLeave .20s cubic-bezier(.4,0,.8,.2) both}
@keyframes appEnter{
  0%{opacity:.7;transform:translateY(38px) scale(.84);clip-path:inset(8% 8% 2% round 34px);filter:brightness(.88)}
  68%{opacity:1;transform:translateY(-3px) scale(1.012);clip-path:inset(0 round 3px);filter:brightness(1.03)}
  100%{opacity:1;transform:translateY(0) scale(1);clip-path:inset(0 round 0);filter:brightness(1)}
}
@keyframes appLeave{
  0%{opacity:1;transform:translateY(0) scale(1);clip-path:inset(0 round 0);filter:brightness(1)}
  100%{opacity:.72;transform:translateY(34px) scale(.86);clip-path:inset(7% 7% 1% round 32px);filter:brightness(.9)}
}
#phone.app-opening main,#phone.app-opening .dock{animation:homeDim .32s cubic-bezier(.2,.8,.2,1) both}
#phone.app-closing main,#phone.app-closing .dock{animation:homeReturn .38s cubic-bezier(.16,1,.3,1) both}
@keyframes homeDim{to{opacity:.42;transform:scale(.94) translateY(8px);filter:blur(1.5px)}}
@keyframes homeReturn{from{opacity:.42;transform:scale(.94) translateY(8px);filter:blur(1.5px)}to{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}}
/* 하단 홈 인디케이터가 앱 종료/홈 복귀 역할을 대신합니다. */

/* 데스크톱에서만 폰 프레임, 모바일은 꽉 찬 화면 */
@media(min-width:700px){#phone{height:min(100dvh,900px);width:min(100vw,calc(100dvh*.5625),506px);border-radius:0}}
</style>
</head>

<iframe id="app" title="앱"></iframe>
<script>
const frame=document.getElementById('app'),homebar=document.querySelector('.homebar'),phone=document.getElementById('phone');
function sizeAppFrame(){const top=frame.dataset.selfpad?0:document.querySelector('.status').offsetHeight,bot=document.querySelector('.homebar').offsetHeight;frame.style.setProperty('position','absolute','important');frame.style.setProperty('top',top+'px','important');frame.style.setProperty('left','0','important');frame.style.setProperty('right','0','important');frame.style.setProperty('bottom',bot+'px','important');frame.style.setProperty('width','100%','important');frame.style.setProperty('height',Math.max(0,phone.clientHeight-top-bot)+'px','important');}
sizeAppFrame();window.addEventListener('resize',sizeAppFrame);
let closeTimer;
function goHome(){
  if(frame.style.display==='none') return;
  frame.classList.remove('app-entering');
  frame.classList.add('app-leaving');
  phone.classList.remove('app-opening');phone.classList.add('app-closing');
  clearTimeout(closeTimer);
  closeTimer=setTimeout(()=>{frame.src='about:blank';frame.style.display='none';document.querySelector('.status').style.setProperty('--app-status-bg','transparent');document.querySelector('.status').style.color='';frame.classList.remove('app-leaving','app-entering');phone.classList.remove('app-closing','app-open','app-light');},150);
}
function tick(){const d=new Date(),h=d.getHours()%12||12,m=String(d.getMinutes()).padStart(2,'0');document.getElementById('clock').textContent=h+':'+m}tick();setInterval(tick,10000);
// 브라우저가 배터리 상태 접근을 지원하는 경우 실제 잔량을 표시합니다.
if(navigator.getBattery){navigator.getBattery().then(battery=>{const fill=document.getElementById('battery-fill');const draw=()=>{fill.setAttribute('width',Math.max(1,15*battery.level));fill.setAttribute('fill',battery.level<=0.2?'#ff453a':'white')};draw();battery.addEventListener('levelchange',draw);}).catch(()=>{});}
document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  clearTimeout(closeTimer);
  phone.classList.remove('app-closing','app-opening');phone.classList.add('app-opening','app-open');
  frame.classList.remove('app-leaving','app-entering');
  delete frame.dataset.selfpad;frame.style.display='block';
  sizeAppFrame();
  frame.src=a.getAttribute('href');
  void frame.offsetWidth;
  frame.classList.add('app-entering');
}));
function syncStatusBar(){
  const status=document.querySelector('.status');
  try{
    const d=frame.contentDocument;
    if(!d){status.style.setProperty('--app-status-bg','transparent');return;}
    const transparent=v=>!v||v==='transparent'||v==='rgba(0, 0, 0, 0)';
    const candidates=[d.querySelector('header'),d.querySelector('nav'),d.querySelector('main'),d.querySelector('[role="main"]'),d.body,d.documentElement].filter(Boolean);
    let color='';
    for(const el of candidates){
      const bg=frame.contentWindow.getComputedStyle(el).backgroundColor;
      if(!transparent(bg)){color=bg;break;}
    }
    status.style.setProperty('--app-status-bg',color||'transparent');const bc=(()=>{try{const w=frame.contentWindow,d=frame.contentDocument;let el=d.elementFromPoint(w.innerWidth/2,w.innerHeight-4);while(el){const c=w.getComputedStyle(el).backgroundColor;if(c&&c!=='rgba(0, 0, 0, 0)'&&c!=='transparent')return c;el=el.parentElement;}}catch(e){}return color||'#fff';})();phone.style.setProperty('--app-bottom-bg',bc);const bm=(bc.match(/\d+(\.\d+)?/g)||[]).map(Number);if(bm.length>=3)phone.classList.toggle('app-light',(.2126*bm[0]+.7152*bm[1]+.0722*bm[2])/255>0.62);
    const fg=(color.match(/rgba?\(([^)]+)\)/)||[])[1];
    if(fg){
      const nums=fg.split(',').slice(0,3).map(v=>parseFloat(v.trim()));
      if(nums.length===3){
        const luminance=(.2126*nums[0]+.7152*nums[1]+.0722*nums[2])/255;
        status.style.color=luminance>0.62?'#111':'#fff';
        status.querySelectorAll('svg').forEach(svg=>svg.style.color=status.style.color);
      }
    }
  }catch(e){status.style.setProperty('--app-status-bg','transparent');}
}
function silenceApp(){
  try{
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;
    const mute=()=>{
      d.querySelectorAll('audio,video').forEach(m=>{try{m.muted=true;m.defaultMuted=true;m.volume=0;m.setAttribute('muted','');}catch(e){}});
      d.querySelectorAll('audio').forEach(m=>{try{m.pause();}catch(e){}});
    };
    mute();
    if(!w.__hwahoSilenceInstalled){
      w.__hwahoSilenceInstalled=true;
      try{
        const proto=w.HTMLMediaElement&&w.HTMLMediaElement.prototype;
        if(proto){
          const play=proto.play;
          proto.play=function(){this.muted=true;this.defaultMuted=true;this.volume=0;return play.call(this);};
        }
      }catch(e){}
      try{
        if(w.AudioContext&&w.AudioContext.prototype){
          const resume=w.AudioContext.prototype.resume;
          w.AudioContext.prototype.resume=function(){return this.suspend();};
        }
        if(w.webkitAudioContext&&w.webkitAudioContext.prototype){
          w.webkitAudioContext.prototype.resume=function(){return this.suspend();};
        }
      }catch(e){}
      try{new w.MutationObserver(mute).observe(d.documentElement,{childList:true,subtree:true});}catch(e){}
    }
  }catch(e){}
}
frame.addEventListener('load',()=>{silenceApp();syncStatusBar();try{if(frame.contentDocument&&frame.contentDocument.documentElement.hasAttribute('data-selfpad')){frame.dataset.selfpad='1';document.querySelector('.status').style.setProperty('--app-status-bg','transparent');sizeAppFrame();}}catch(e){}});

let hbY=null,hbX=0;

homebar.addEventListener('pointerup',e=>{if(hbY===null)return;const dy=hbY-e.clientY,dx=Math.abs(hbX-e.clientX),dist=Math.hypot(dx,dy);hbY=null;if(dist<14||(dy>18&&dy>dx*.8))goHome();});
homebar.addEventListener('pointercancel',()=>{hbY=null});
window.Island={show(i){const el=document.getElementById('island');if(!el)return;el.classList.add('ex');el.innerHTML='';const t=document.createElement('span');t.className='isl-t';t.textContent=i&&i.title||'';const a=document.createElement('span');a.className='isl-s';a.textContent=i&&i.artist||'';el.append(t,a);},hide(){const el=document.getElementById('island');if(!el)return;el.classList.remove('ex');el.textContent='';}};
