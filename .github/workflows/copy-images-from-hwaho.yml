name: Copy image assets from hwaho

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/copy-images-from-hwaho.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hwaho2
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download source image folders
        run: |
          git clone --depth 1 https://github.com/cnstkal/hwaho.git /tmp/hwaho-source
          mkdir -p images/app
          cp -a /tmp/hwaho-source/Images/Apps/. images/app/
          for src in /tmp/hwaho-source/Images/*; do
            [ -d "$src" ] || continue
            name="$(basename "$src")"
            [ "$name" = "Apps" ] && continue
            dest="$name"
            [ "$name" = "naver" ] && dest="Naver"
            mkdir -p "images/app/$dest"
            cp -a "$src/." "images/app/$dest/"
          done
      - name: Commit copied images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/app
          if git diff --cached --quiet; then
            echo "No new image files to copy."
          else
            git commit -m "Copy image assets from hwaho"
            git push origin HEAD:main
          fi
